<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeTutor - Verified In-Home Tutors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3 text-2xl font-black text-indigo-400 tracking-tight">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <span>HomeTutor</span>
      </div>
      <button onclick="openModal('tutorModal')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-indigo-500 shadow-lg shadow-indigo-600/20 transition flex items-center gap-2">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Become a Tutor</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative overflow-hidden pt-16 pb-12 max-w-7xl mx-auto px-6">
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="text-center max-w-3xl mx-auto relative z-10">
      <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold mb-6">
        <i class="fa-solid fa-shield-check"></i> Verified Educators in Ethiopia
      </span>
      
      <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight mb-6 leading-tight">
        Find Qualified In-Home Tutors <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">Near You</span>
      </h1>
      
      <p class="text-slate-400 text-base md:text-lg mb-8 max-w-2xl mx-auto">
        Connect with degreed professionals (B.Sc, M.Sc, PhD). Pay seamlessly via Telebirr or CBE Birr.
      </p>

      <!-- Search & Filters -->
      <div class="bg-slate-800/60 backdrop-blur-lg border border-slate-700/60 p-2.5 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-2 max-w-2xl mx-auto mb-8">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
          <input id="searchInput" onkeyup="filterTutors()" type="text" placeholder="Search by subject (e.g. Physics, Math)..." class="w-full pl-11 pr-4 py-2.5 bg-slate-900/50 text-white rounded-xl border border-slate-700/50 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <select id="degreeFilter" onchange="filterTutors()" class="bg-slate-900/50 text-slate-300 border border-slate-700/50 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          <option value="ALL">All Degrees</option>
          <option value="B.Sc">B.Sc / B.A.</option>
          <option value="M.Sc">M.Sc / Master's</option>
          <option value="Ph.D">Ph.D. Doctorate</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Tutors Grid -->
  <section class="py-6 max-w-7xl mx-auto px-6 mb-20">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-user-graduate text-indigo-400"></i>
        <span>Available Tutors</span>
      </h2>
      <span id="tutorCount" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 border border-slate-700">0 Available</span>
    </div>

    <div id="tutorGrid" class="grid md:grid-cols-3 gap-6">
      <div class="bg-slate-800/40 border border-slate-800 p-6 rounded-2xl animate-pulse">
        <div class="h-6 bg-slate-700/50 rounded w-1/2 mb-3"></div>
        <div class="h-4 bg-slate-700/30 rounded w-1/3 mb-4"></div>
        <div class="h-16 bg-slate-700/20 rounded mb-4"></div>
        <div class="h-10 bg-slate-700/50 rounded"></div>
      </div>
    </div>
  </section>

  <!-- Modals (Booking & Registration) -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('bookingModal')" class="absolute right-4 top-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-1 text-white">Book Lesson</h3>
      <p id="modalTutorName" class="text-sm text-indigo-400 font-semibold mb-4"></p>

      <form onsubmit="payWithChapa(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">PARENT EMAIL</label>
          <input id="parentEmail" required type="email" placeholder="parent@gmail.com" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">PHONE NUMBER (Telebirr / CBE)</label>
          <input id="parentPhone" required type="tel" placeholder="0912345678" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-500 transition shadow-lg shadow-emerald-600/20">
          Pay with Telebirr / CBE Birr
        </button>
      </form>
    </div>
  </div>

  <div id="tutorModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('tutorModal')" class="absolute right-4 top-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-2xl font-black mb-4 text-white">Register as a Tutor</h3>
      
      <form onsubmit="registerTutor(event)" class="space-y-3">
        <input id="tName" required type="text" placeholder="Full Name" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        
        <div class="grid grid-cols-2 gap-2">
          <input id="tRate" required type="number" placeholder="Hourly Rate (ETB)" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
          <select id="tDegree" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
            <option value="B.Sc / B.A. Degree">B.Sc / B.A. Degree</option>
            <option value="M.Sc / M.A. Master's">M.Sc / M.A. Master's</option>
            <option value="Ph.D. Doctorate">Ph.D. Doctorate</option>
            <option value="University Student">University Student</option>
          </select>
        </div>

        <input id="tSubject" required type="text" placeholder="Subject (e.g. Physics, Math)" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
        
        <select id="tGrade" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm">
          <option value="High School (9-12)">High School (9-12)</option>
          <option value="Middle School (6-8)">Middle School (6-8)</option>
          <option value="Elementary (K-5)">Elementary (K-5)</option>
        </select>

        <textarea id="tBio" required placeholder="Describe your teaching experience and degree..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm"></textarea>
        
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/20">Publish Live Profile</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dgpuehsptskscaaoxkij.supabase.co";
    const SUPABASE_KEY = "sb_publishable__5FrMgFc1iADdQ-M74DxDQ_Qr7VRlC8";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allTutors = [];
    let selectedTutor = null;

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function loadTutors() {
      const { data: tutors, error } = await supabase.from('tutors').select('*');
      const grid = document.getElementById('tutorGrid');
      
      if (error || !tutors || !tutors.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-slate-800/30 rounded-2xl border border-dashed border-slate-800">
            <i class="fa-solid fa-folder-open text-3xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 font-medium">No tutors registered yet.</p>
            <button onclick="openModal('tutorModal')" class="mt-3 text-indigo-400 text-sm font-semibold hover:underline">+ Add the first tutor profile</button>
          </div>
        `;
        document.getElementById('tutorCount').innerText = '0 Available';
        return;
      }

      allTutors = tutors;
      renderTutors(allTutors);
    }

    function renderTutors(tutors) {
      const grid = document.getElementById('tutorGrid');
      grid.innerHTML = '';
      document.getElementById('tutorCount').innerText = `${tutors.length} Available`;

      tutors.forEach(t => {
        grid.innerHTML += `
          <div class="bg-slate-800/60 border border-slate-700/60 p-6 rounded-2xl shadow-xl hover:border-indigo-500/50 transition duration-200">
            <div class="flex items-start justify-between mb-3">
              <div>
                <h3 class="font-bold text-lg text-white">${t.full_name}</h3>
                <p class="text-indigo-400 text-xs font-semibold mt-0.5"><i class="fa-solid fa-book-open mr-1"></i> ${t.subject_title}</p>
              </div>
              <span class="bg-slate-700/50 text-slate-300 text-xs px-2.5 py-1 rounded-md font-medium border border-slate-600/50">${t.grade_level || 'General'}</span>
            </div>
            <p class="text-slate-400 text-sm mb-6 line-clamp-3 leading-relaxed">${t.bio}</p>
            <div class="flex items-center justify-between border-t border-slate-700/50 pt-4">
              <div>
                <span class="text-xl font-black text-white">${t.hourly_rate}</span>
                <span class="text-slate-400 text-xs font-semibold"> ETB/hr</span>
              </div>
              <button onclick="startBooking('${t.full_name}', ${t.hourly_rate})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/20">Book Lesson</button>
            </div>
          </div>
        `;
      });
    }

    function filterTutors() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const degree = document.getElementById('degreeFilter').value;

      const filtered = allTutors.filter(t => {
        const matchesSubject = t.subject_title.toLowerCase().includes(query) || t.full_name.toLowerCase().includes(query);
        const matchesDegree = degree === 'ALL' || t.bio.includes(degree);
        return matchesSubject && matchesDegree;
      });

      renderTutors(filtered);
    }

    async function registerTutor(e) {
      e.preventDefault();
      const degree = document.getElementById('tDegree').value;
      const bioText = `[${degree}] ` + document.getElementById('tBio').value;

      const newTutor = {
        full_name: document.getElementById('tName').value,
        hourly_rate: document.getElementById('tRate').value,
        subject_title: document.getElementById('tSubject').value,
        grade_level: document.getElementById('tGrade').value,
        bio: bioText
      };

      const { error } = await supabase.from('tutors').insert([newTutor]);
      if (!error) {
        closeModal('tutorModal');
        loadTutors();
      } else {
        alert('Error saving tutor: ' + error.message);
      }
    }

    function startBooking(name, rate) {
      selectedTutor = { name, rate };
      document.getElementById('modalTutorName').innerText = `Tutor: ${name} (${rate} ETB/hr)`;
      openModal('bookingModal');
    }

    function payWithChapa(e) {
      e.preventDefault();
      const totalAmount = Number(selectedTutor.rate) + 100;
      alert(`Redirecting to Telebirr / CBE Birr via Chapa...\nTotal Payment: ${totalAmount} ETB (Includes 100 ETB Service Fee)`);
      closeModal('bookingModal');
    }

    loadTutors();
  </script>
</body>
</html>
