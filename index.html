<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeTutor - Verified In-Home Tutors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <!-- Header -->
  <header class="border-b bg-white sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2 text-2xl font-black text-indigo-600 tracking-tight">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>HomeTutor</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openModal('tutorModal')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-md transition">+ Apply as a Tutor</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-7xl mx-auto px-6 py-16 text-center">
    <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4">Find Expert In-Home Tutors in Ethiopia</h1>
    <p class="text-slate-600 max-w-xl mx-auto mb-8">Pay securely via Telebirr or CBE Birr. Verified educators with B.Sc, M.Sc, and PhD qualifications.</p>
  </section>

  <!-- Dynamic Tutors Grid -->
  <section class="py-10 max-w-7xl mx-auto px-6">
    <h2 class="text-2xl font-bold mb-6">Available Educators</h2>
    <div id="tutorGrid" class="grid md:grid-cols-3 gap-6">
      <p class="text-slate-500">Loading tutors from database...</p>
    </div>
  </section>

  <!-- Booking Modal (Parents) -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('bookingModal')" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-xl font-bold mb-1">Book Lesson (Chapa Payment)</h3>
      <p id="modalTutorName" class="text-sm text-indigo-600 font-semibold mb-4"></p>

      <form onsubmit="payWithChapa(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">PARENT EMAIL</label>
          <input id="parentEmail" required type="email" placeholder="parent@gmail.com" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">PHONE NUMBER (Telebirr / CBE)</label>
          <input id="parentPhone" required type="tel" placeholder="0912345678" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition mt-2">
          Pay with Telebirr / CBE Birr
        </button>
      </form>
    </div>
  </div>

  <!-- Tutor Onboarding Modal (Teachers with Degree Level) -->
  <div id="tutorModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="closeModal('tutorModal')" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      <h3 class="text-2xl font-black mb-4">Register as a Tutor</h3>
      
      <form onsubmit="registerTutor(event)" class="space-y-3">
        <input id="tName" required type="text" placeholder="Full Name" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
        
        <div class="grid grid-cols-2 gap-2">
          <input id="tRate" required type="number" placeholder="Hourly Rate (ETB)" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
          <select id="tDegree" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm font-semibold">
            <option value="B.Sc / B.A. Degree">B.Sc / B.A. Degree</option>
            <option value="M.Sc / M.A. Master's">M.Sc / M.A. Master's</option>
            <option value="Ph.D. Doctorate">Ph.D. Doctorate</option>
            <option value="University Student">University Student</option>
          </select>
        </div>

        <input id="tSubject" required type="text" placeholder="Subject (e.g. Physics, Math, English)" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
        
        <select id="tGrade" class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm">
          <option value="High School (9-12)">High School (9-12)</option>
          <option value="Middle School (6-8)">Middle School (6-8)</option>
          <option value="Elementary (K-5)">Elementary (K-5)</option>
        </select>

        <textarea id="tBio" required placeholder="Describe your degree, university background, and teaching experience..." class="w-full px-4 py-2.5 border rounded-xl bg-slate-50 text-sm"></textarea>
        
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">Publish Live Profile</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dgpuehsptskscaaoxkij.supabase.co";
    const SUPABASE_KEY = "sb_publishable__5FrMgFc1iADdQ-M74DxDQ_Qr7VRlC8";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let selectedTutor = null;

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function loadTutors() {
      const { data: tutors, error } = await supabase.from('tutors').select('*');
      const grid = document.getElementById('tutorGrid');
      grid.innerHTML = '';

      if (error || !tutors || !tutors.length) {
        grid.innerHTML = '<p class="text-slate-500">No tutors registered yet. Click "+ Apply as a Tutor" to add the first profile!</p>';
        return;
      }

      tutors.forEach(t => {
        grid.innerHTML += `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-lg">${t.full_name}</h3>
              <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-md font-bold">${t.grade_level || 'Degree Holder'}</span>
            </div>
            <p class="text-slate-500 text-sm font-medium mb-1"><i class="fa-solid fa-graduation-cap text-indigo-600"></i> ${t.subject_title}</p>
            <p class="text-slate-600 text-sm my-3">${t.bio}</p>
            <div class="flex items-center justify-between border-t pt-3 mt-4">
              <span class="text-lg font-black">${t.hourly_rate} ETB/hr</span>
              <button onclick="startBooking('${t.full_name}', ${t.hourly_rate})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">Book & Pay</button>
            </div>
          </div>
        `;
      });
    }

    async function registerTutor(e) {
      e.preventDefault();
      const degree = document.getElementById('tDegree').value;
      const bioText = `[${degree}] ` + document.getElementById('tBio').value;

      const newTutor = {
        full_name: document.getElementById('tName').value,
        hourly_rate: document.getElementById('tRate').value,
        subject_title: document.getElementById('tSubject').value,
        grade_level: document.getElementById('tGrade').value,
        bio: bioText
      };

      const { error } = await supabase.from('tutors').insert([newTutor]);
      if (!error) {
        alert('Tutor profile published live to database!');
        closeModal('tutorModal');
        loadTutors();
      } else {
        alert('Error saving tutor: ' + error.message);
      }
    }

    function startBooking(name, rate) {
      selectedTutor = { name, rate };
      document.getElementById('modalTutorName').innerText = `Tutor: ${name} (${rate} ETB/hr)`;
      openModal('bookingModal');
    }

    function payWithChapa(e) {
      e.preventDefault();
      const totalAmount = Number(selectedTutor.rate) + 100;
      alert(`Redirecting to Telebirr / CBE Birr via Chapa...\nTotal Payment: ${totalAmount} ETB (Includes 100 ETB Service Fee)`);
      closeModal('bookingModal');
    }

    loadTutors();
  </script>
</body>
</html>
